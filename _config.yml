title: 巴比旅行 - 坦桑尼亚Safari专家
description: 坦桑尼亚专业地接旅行社,提供塞伦盖蒂、恩戈罗恩戈罗、乞力马扎罗等经典Safari套餐,中文服务,安全可靠。
languages:
  - zh
  - en
  - fr
default_lang: "zh"
baseurl: "" # Set to empty for root domain
url: "https://balbina-safari.github.io"

# SEO Configuration
lang: zh-CN
author: Balbina Safari
twitter:
  username: balbinasafari
  card: summary_large_image
social:
  name: Balbina Safari
  links:
    - https://balbinasafari.github.io
    - https://twitter.com/balbinasafari
    - https://www.facebook.com/balbinasafari

# No theme selected - using custom CSS in assets/css/style.css
# remote_theme: Minima
# Collections Configuration
collections:
  packages:
    output: true
    permalink: /packages/:path/
  wildlife:
    output: true
    permalink: /wildlife/:path/
  destinations:
    output: true
    permalink: /destinations/:path/
  hotels:
    output: true
    permalink: /hotels/:path/

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# 排除仓库维护文档（非网站页面，避免被 jekyll-optional-front-matter 当页面处理导致 {% seo %} 等 Liquid 报错）
# 注意：自定义 exclude 会覆盖 Jekyll 默认值，须把默认的 vendor/node_modules 等也加回来
exclude:
  - AGENTS.md
  - DESIGN_SKILLS.md
  - OPTIMIZATION_SUMMARY.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle
  - vendor/cache
  - vendor/gems
  - vendor/ruby
