<div>
  <h3>🎯 {{ strings.ui.target_audience }}</h3>
  <div class="audience-tags">
    {% if page.target_audience %} {% for audience in page.target_audience %}
    <span class="audience-tag">{{ audience }}</span>
    {% endfor %} {% else %}
    <span class="audience-tag"
      >{% if current_lang == 'en' %}First-time Safari{% else %}首次Safari{%
      endif %}</span
    >
    <span class="audience-tag"
      >{% if current_lang == 'en' %}Couples{% else %}情侣/夫妻{% endif %}</span
    >
    {% endif %}
  </div>
</div>
