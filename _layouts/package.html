---
layout: default
---

{% include lang_init.html %}

<div class="package-layout">
  <div class="package-header">
    <h1 class="page-title">
      {{ page.title }}
      <span class="english-title">/ {{ page.english_title }}</span>
    </h1>
    <p class="package-meta">
      <span class="duration">⏱️ {{ page.duration }}</span> |
      <span class="difficulty">🎯 {{ page.difficulty }}</span> |
      <span class="group-size">👥 {{ page.group_size }}</span>
    </p>
  </div>

  <hr />

  <!-- Package Info Section (formerly sidebar) -->
  <div class="package-info">{% include packages/sidebar.html %}</div>

  <hr />

  <main class="package-content">{{ content }}</main>
</div>
